name: Build DLL
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: sudo apt-get install -y mingw-w64
      - name: Configure CMake
        run: cmake -B build -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++
      - name: Build
        run: cmake --build build
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: css-v34-menu-dll
          path: build/**/*.dll
